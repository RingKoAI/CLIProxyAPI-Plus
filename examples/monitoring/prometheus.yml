global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cliproxy
    metrics_path: /metrics
    authorization:
      type: Bearer
      # Create this file with the same token as CLIPROXY_METRICS_TOKEN.
      # The path is relative to Prometheus's working directory.
      credentials_file: ./cliproxy-metrics-token
    static_configs:
      - targets: ["127.0.0.1:8317"]
        # For Docker Desktop scraping a Windows host, use host.docker.internal:8317.
